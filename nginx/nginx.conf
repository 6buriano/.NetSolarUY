# Nginx como único punto de entrada de SolarUY: activo/pasivo entre dos réplicas idénticas.
#
#   web1  atiende todo el tráfico (servidor principal del upstream)
#   web2  está en "backup": nginx solo le manda pedidos si web1 falla
#
# Si web1 acumula max_fails fallas dentro de fail_timeout, nginx lo saca de rotación ese
# tiempo y todo pasa a web2. No hay sticky sessions ni estado compartido en el servidor
# (Data Protection va en un volumen), así que cualquier réplica puede atender a cualquier
# usuario. Sin TLS en esta entrega: ver el bloque comentado en el server.

user  nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # No publicar la versión de nginx en las respuestas de error.
    server_tokens off;

    sendfile on;

    # $upstream_addr es la dirección de la réplica que atendió (con "a, b" si hubo reintento):
    # sirve para verificar el failover sin adivinar.
    log_format principal '$remote_addr - "$request" $status $body_bytes_sent $upstream_addr $request_time';
    access_log /var/log/nginx/access.log principal;
    error_log  /var/log/nginx/error.log warn;

    # WebSocket (para cuando entre SignalR). Con "''" y no "close" el header Connection
    # queda vacío en el tráfico normal, que es lo que necesita el keepalive hacia las réplicas.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    upstream solaruy_web {
        # El estado de fallos (max_fails / fail_timeout) vive en esta zona de memoria compartida.
        # Sin "zone" es por proceso worker: con worker_processes auto las peticiones caen en
        # workers distintos, el contador no junta los 3 fallos y el failover se vuelve aleatorio.
        zone solaruy_web 64k;

        server web1:8080 max_fails=3 fail_timeout=10s;
        server web2:8080 backup     max_fails=3 fail_timeout=10s;

        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # ---- TLS (pendiente) ----------------------------------------------------------
        # Cuando haya dominio y certificado, se descomenta esto y se agrega un server
        # :80 que redirija a https. Recién ahí el X-Forwarded-Proto pasa a "https" y
        # tiene sentido HSTS en la aplicación.
        #
        # listen 443 ssl;
        # ssl_certificate     /etc/nginx/certs/fullchain.pem;
        # ssl_certificate_key /etc/nginx/certs/privkey.pem;
        # ssl_protocols       TLSv1.2 TLSv1.3;
        # ssl_session_cache   shared:SSL:10m;

        client_max_body_size 10m;

        # Permite saber qué réplica respondió: se usa en la verificación del failover.
        add_header X-Upstream-Addr $upstream_addr always;

        # Healthcheck del propio nginx (no toca las réplicas).
        location = /nginx-health {
            access_log off;
            return 200 "ok";
        }

        location / {
            proxy_pass http://solaruy_web;

            # WebSocket + keepalive hacia las réplicas.
            proxy_http_version 1.1;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header Upgrade           $http_upgrade;

            # Cabeceras que la aplicación necesita para reconstruir el pedido original:
            # sin X-Forwarded-Proto, UseHttpsRedirection y las cookies salen mal.
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;

            # Timeouts: la conexión se corta rápido para detectar una réplica caída; la
            # lectura se deja más larga para no cortar un pedido que está en curso.
            # 1 s y no 3 s: es lo que paga el primer pedido cuando la réplica se detuvo
            # (con un proceso muerto el sistema responde al instante, sin esperar).
            proxy_connect_timeout 1s;
            proxy_send_timeout    30s;
            proxy_read_timeout    60s;
            proxy_socket_keepalive on;

            # Reintento SOLO si el pedido no llegó a la réplica (conexión rechazada o
            # timeout de conexión). Los 5xx quedan afuera a propósito: reintentar un POST
            # que web1 ya procesó duplicaría el alta.
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;
        }

        # Cuando entre SignalR, el hub va en su propio location con proxy_read_timeout
        # largo (3600s), para no cortar el WebSocket.
    }
}
