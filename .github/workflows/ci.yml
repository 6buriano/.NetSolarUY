# CI básico: build + tests, en cada push y pull request a main.
#
# Las pruebas unitarias (dominio, aplicación, arquitectura, simulador) no necesitan nada externo.
# Las de integración (tests/SolarUY.IntegrationTests) corren contra un MySQL real: el servicio de
# abajo lo levanta y SOLARUY_TEST_MYSQL le dice a las pruebas cómo conectarse. Cada prueba crea su
# propia base y la borra al terminar.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Clonar el repo (con el submódulo del simulador)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar dependencias
        run: dotnet restore SolarUY.slnx

      - name: Compilar (sin warnings tratados como error, igual que en local)
        run: dotnet build SolarUY.slnx --configuration Release --no-restore

      - name: Ejecutar pruebas (unitarias e integración)
        env:
          SOLARUY_TEST_MYSQL: "Server=127.0.0.1;Port=3306;User=root;Password=ci_root;"
        run: dotnet test SolarUY.slnx --configuration Release --no-build --verbosity normal
